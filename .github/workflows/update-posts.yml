name: Update Content

on:
  schedule:
    # Every two hours, at :17 rather than on the hour.
    #
    # This was */15, which GitHub mostly dropped: the April run history shows
    # real gaps of 25-70 minutes against a 15-minute schedule. Scheduled
    # workflows are best-effort and the top of the hour is the most contended
    # slot, so an off-the-hour, less frequent schedule actually runs more
    # reliably than a frequent one. The feeds are a personal blog and a reading
    # list; two hours is well inside how fast either changes.
    #
    # Push a commit or use "Run workflow" to sync immediately.
    - cron: '17 */2 * * *'
  workflow_dispatch:

# The job only needs to commit back to this repository.
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit SHA: this job holds contents: write, and a tag can
      # be moved to point at different code.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          # Full history: update-seo.js dates each sitemap entry from the file's
          # last commit. A shallow clone has one commit, so every page got its date.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '20'
      - name: Test content scripts
        run: node scripts/test-scripts.js
      - name: Build blog from markdown
        run: node scripts/update-blog.js
      - name: Import posts from RSS feeds
        run: node scripts/update-posts.js
      # Second pass: update-posts.js writes new markdown into posts/, which only
      # becomes HTML when update-blog.js runs again.
      - name: Rebuild blog with newly imported posts
        run: node scripts/update-blog.js
      - name: Update library from Goodreads
        run: node scripts/update-library.js
      # These two run last so pages generated above are normalised too.
      - name: Normalise site footer
        run: node scripts/update-footer.js
      - name: Refresh llms.txt, sitemap and discovery tags
        run: node scripts/update-seo.js
      - name: Commit changes
        run: |
          git diff --quiet && git diff --cached --quiet || (
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A index.html archive.html about.html now.html quotes.html notes.html claude-skills.html autofill.html awareness.html posts/ blog/ blog-posts.json library.html library/ llms.txt sitemap.xml cyber.html veridis-quo.html
            git commit -m "Update content from feeds"
            git push
          )                             
